<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header class="cabecalho"><!--cabecalho do site-->
        <div class="logo">CineSenai</div>
        <nav class="menu">
            <a href="index.html">Em cartaz</a>
            <a href="em_breve.html">Em breve</a>
            <a href="precos.html">Preços</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="Container">
        <h1>Cadastro para dicas de filmes</h1>
        <p class="subtitulo">Preencha seus dados para realizar a inscrição no CineSenai</p>

        <div class="area-incrição">

            <form action="/processar-cadastro" method="post" class="coluna-form">

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="data_nasc">Data de nascimento:</label>
                <input type="date" id="data_nasc" name="data_nascimneto" min="1900-01-01" max="2026-12-31" required><br>

                <label>Periodo filmes:</label><br>
                <input type="radio" id="turno" name="turno" value="manha" required>
                <label for="turno_manha">Manha</label><br>
                <input type="radio" id="turno_tarde" name="tarde" value="tarde">
                <label for="turno_tarde">tarde</label><br>

                <input type="radio" id="turno_noite" name="turno" value="noite">
                <label for="turno_noite">Noite</label><br><br>

                <label>Filmes de Interesse:</label><br>
                <input type="checkbox" id="acao" name="interesses" value="acao">
                <label for="acao">Filme de Ação</label><br>

                <input type="checkbox" id="Comedia" name="Interesse" value="Comedia">
                <label for="Comedia">Filme de Comedia</label><br>

                <input type="checkbox" id="Terror" name="Interesse" value="Terror">
                <label for="Terror">Filme de Terror</label><br><br>

                <label for="unidade">Selecione o cinema</label><br>
                <select name="unidade" id="unidade" required>
                    <option value="" disa selected>Selecione um cinema</option>
                    <option value="sp">São Paulo-capital</option>
                    <option value="sebastianopolis">Sebastianópolis do Sul</option>
                    <option value="votuporanga">Votuporanga</option>
                    <option value="valentim gentil">Valentim Gentil</option>

                </select>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e aceito os termos</label><br><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Limpar</button>



            </form>

            <div class="coluna-midia">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3733.325289857872!2d-49.92364282604476!3d-20.65634091133467!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd7b4b248f03a1%3A0xb8ed21a313f879da!2sSebastianopolis%20do%20Sul!5e0!3m2!1spt-BR!2sbr!4v1787665697244!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

                <iframe width="560" height="315" src="https://www.youtube.com/embed/Y-yWXimyorQ?si=EfipDu7tpCju0ZZJ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            </div>

        </div>


    </main>
</body>
</html>
